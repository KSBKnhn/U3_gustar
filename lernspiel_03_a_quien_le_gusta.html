<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>¿A quién le gusta? – Unidad 3</title>
<style>
  :root{
    --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --ink2:#6E6E73;
    --verde:#34C759; --verde-soft:#E8F9EE;
    --rojo:#FF3B30; --rojo-soft:#FFECEB;
    --azul:#0071E3; --azul-soft:#EAF3FD;
    --naranja:#FF9500; --naranja-soft:#FFF3E5; --naranja-ink:#B36A00;
    --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    min-height:100dvh; padding:16px;
  }
  .app{width:100%; max-width:440px; display:flex; flex-direction:column; gap:14px; flex:1}

  header{display:flex; justify-content:space-between; align-items:center; padding:4px 2px}
  .level-pill{background:var(--card); border-radius:999px; padding:8px 16px; font-size:15px; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .score{font-size:17px; font-weight:700; font-variant-numeric:tabular-nums}
  .score span{color:var(--ink2); font-weight:500; font-size:13px}
  .progress{height:6px; background:#E5E5EA; border-radius:3px; overflow:hidden}
  .progress i{display:block; height:100%; width:0%; background:var(--naranja); border-radius:3px; transition:width .35s ease}

  .card{
    background:var(--card); border-radius:var(--radius);
    box-shadow:0 2px 12px rgba(0,0,0,.06);
    padding:24px 20px; text-align:center;
  }
  .task-label{font-size:13px; color:var(--ink2); margin-bottom:10px}
  .persona{
    display:inline-block; font-size:24px; font-weight:800;
    color:var(--naranja-ink); background:var(--naranja-soft);
    border-radius:16px; padding:14px 22px;
  }
  .persona small{display:block; font-size:14px; font-weight:600; color:var(--ink2); margin-top:4px}
  .sentence{font-size:21px; font-weight:600; line-height:1.5; margin:8px 0}
  .sentence .gap{display:inline-block; min-width:76px; border-bottom:2.5px solid var(--naranja); color:var(--naranja); padding:0 4px}
  .sentence .em{font-size:1.15em}

  .answers{display:flex; flex-direction:column; gap:10px}
  .answers.row{flex-direction:row}
  .answers.row .btn{flex:1}
  .btn{
    min-height:54px; border:none; border-radius:16px;
    background:var(--card); color:var(--ink);
    font-family:inherit; font-size:19px; font-weight:700;
    box-shadow:0 1px 4px rgba(0,0,0,.07);
    padding:12px 16px; cursor:pointer;
    transition:transform .12s ease, background .2s, color .2s;
  }
  .btn:active{transform:scale(.97)}
  .btn.ok{background:var(--verde); color:#fff}
  .btn.bad{background:var(--rojo); color:#fff}
  .btn.dim{opacity:.45}

  .btn-primary{
    min-height:54px; border:none; border-radius:999px;
    background:var(--azul); color:#fff; font-family:inherit;
    font-size:18px; font-weight:700; padding:14px 28px; cursor:pointer;
    transition:transform .12s ease;
  }
  .btn-primary:active{transform:scale(.97)}
  .btn-primary:disabled{opacity:.4}

  /* Level 3: Satz-Bauleiste */
  .buildbar{
    min-height:64px; background:var(--card); border-radius:16px;
    box-shadow:inset 0 0 0 2px #E5E5EA;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    padding:10px; justify-content:center;
  }
  .buildbar.empty::before{content:"Tippe die Bausteine an ↓"; color:#C7C7CC; font-size:15px; font-weight:600}
  .pool{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
  .tile{
    min-height:48px; border:none; border-radius:14px;
    font-family:inherit; font-size:17px; font-weight:700;
    padding:11px 16px; cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,.07);
    transition:transform .12s ease, opacity .2s;
    background:var(--card); color:var(--ink);
  }
  .tile:active{transform:scale(.95)}
  .tile.pron{background:var(--naranja-soft); color:var(--naranja-ink)}
  .tile.act{background:var(--azul-soft); color:var(--azul)}
  .tile.used{opacity:.25; pointer-events:none}
  .buildbar .tile{box-shadow:0 1px 4px rgba(0,0,0,.1)}

  .feedback{
    min-height:52px; border-radius:16px; padding:12px 16px;
    font-size:16px; font-weight:600; display:none; align-items:center; justify-content:center;
    text-align:center; line-height:1.45;
  }
  .feedback.show{display:flex; animation:pop .3s ease}
  .feedback.good{background:var(--verde-soft); color:#1B7A3D}
  .feedback.bad{background:var(--rojo-soft); color:#B3261E}
  @keyframes pop{from{transform:scale(.94);opacity:0} to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){ .feedback.show{animation:none} }

  .screen{flex:1; display:flex; flex-direction:column; justify-content:center; gap:16px; text-align:center; animation:pop .35s ease}
  .screen h1{font-size:30px; font-weight:800; letter-spacing:-.5px}
  .screen h1 em{font-style:normal; color:var(--naranja)}
  .screen p{font-size:17px; color:var(--ink2); line-height:1.5}
  .lv-list{display:flex; flex-direction:column; gap:10px; text-align:left}
  .lv-item{background:var(--card); border-radius:16px; padding:14px 16px; display:flex; gap:12px; align-items:center; box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .lv-item .n{width:34px; height:34px; border-radius:10px; background:var(--naranja-soft); color:var(--naranja-ink); font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0}
  .lv-item div b{display:block; font-size:16px}
  .lv-item div span{font-size:13.5px; color:var(--ink2)}

  .result-bar{background:var(--card); border-radius:16px; padding:14px 16px; text-align:left; box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .result-bar b{font-size:15.5px}
  .result-bar .track{height:8px; background:#E5E5EA; border-radius:4px; margin-top:8px; overflow:hidden}
  .result-bar .fill{height:100%; border-radius:4px; width:0; transition:width .8s ease}
  .tag{font-size:13px; font-weight:700; padding:3px 10px; border-radius:999px; float:right}
  .tag.can{background:var(--verde-soft); color:#1B7A3D}
  .tag.train{background:var(--rojo-soft); color:#B3261E}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="app">

  <!-- START -->
  <section class="screen" id="start">
    <div style="font-size:60px">🧡</div>
    <h1>¿A quién <em>le</em> gusta?</h1>
    <p>gustar für alle Personen · Unidad 3<br>3 Levels · ca. 10 Minuten</p>
    <div class="lv-list">
      <div class="lv-item"><span class="n">1</span><div><b>Erkennen</b><span>Person → Pronomen antippen</span></div></div>
      <div class="lv-item"><span class="n">2</span><div><b>Anwenden</b><span>me/te/le/nos/os/les · gusta oder gustan</span></div></div>
      <div class="lv-item"><span class="n">3</span><div><b>Bauen</b><span>Sätze aus Bausteinen zusammensetzen</span></div></div>
    </div>
    <button class="btn-primary" onclick="startGame()">Empezar</button>
  </section>

  <!-- SPIEL -->
  <section id="game" class="hidden" style="display:flex;flex-direction:column;gap:14px;flex:1">
    <header>
      <span class="level-pill" id="levelPill">Level 1</span>
      <span class="score"><span>Puntos&nbsp;</span><b id="score">0</b></span>
    </header>
    <div class="progress"><i id="bar"></i></div>

    <div class="card" id="qcard">
      <div class="task-label" id="taskLabel"></div>
      <div id="qbody"></div>
    </div>

    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <div style="text-align:center"><button class="btn-primary hidden" id="nextBtn" onclick="nextQ()">Weiter</button></div>
  </section>

  <!-- ENDE -->
  <section class="screen hidden" id="end">
    <div style="font-size:60px" id="endEmoji">🎉</div>
    <h1 id="endTitle">¡Muy bien!</h1>
    <p><b id="endScore" style="color:var(--ink);font-size:22px"></b> Punkte</p>
    <div id="results" style="display:flex;flex-direction:column;gap:10px"></div>
    <button class="btn-primary" onclick="location.reload()">Otra vez</button>
  </section>
</div>

<script>
/* ---------- Inhalte: nur Unidad 3, alle 6 Pronomen ---------- */

// Level 1: Person -> Pronomen (10 P.)
const L1 = [
  {p:"a mí", d:"ich", a:"me", o:["me","te","le"]},
  {p:"a ti", d:"du", a:"te", o:["te","le","os"]},
  {p:"a Lena", d:"sie (eine Person)", a:"le", o:["le","les","me"]},
  {p:"a nosotros", d:"wir", a:"nos", o:["os","nos","les"]},
  {p:"a vosotras", d:"ihr", a:"os", o:["nos","le","os"]},
  {p:"a mis amigos", d:"meine Freunde", a:"les", o:["le","les","nos"]},
  {p:"a usted", d:"Sie (Höflichkeit, 1 Person)", a:"le", o:["les","le","te"]},
  {p:"a ellas", d:"sie (mehrere)", a:"les", o:["les","os","le"]},
];

// Level 2: Lücken (10 P.) – t:"pron" = Pronomen-Lücke (3 Optionen), t:"verb" = gusta/gustan (2 Buttons)
const L2 = [
  {t:"pron", s:["A nosotros ", " gusta ir al cine. 🎬"], a:"nos", o:["nos","os","les"]},
  {t:"verb", s:["Me ", " los videojuegos. 🎮"], a:"gustan", o:["gusta","gustan"]},
  {t:"pron", s:["A vosotros ", " gusta bailar. 💃"], a:"os", o:["nos","os","le"]},
  {t:"pron", s:["A mis amigos ", " gusta el fútbol. ⚽"], a:"les", o:["le","les","nos"]},
  {t:"verb", s:["Nos ", " los conciertos. 🎤"], a:"gustan", o:["gusta","gustan"]},
  {t:"pron", s:["¿A ti ", " gusta viajar? ✈️"], a:"te", o:["te","le","os"]},
  {t:"verb", s:["A Lena le ", " escuchar música. 🎧"], a:"gusta", o:["gusta","gustan"]},
  {t:"verb", s:["A ellos les ", " los libros. 📚"], a:"gustan", o:["gusta","gustan"]},
];

// Level 3: Satz bauen (20 P.) – Bausteine + 1 falscher Verb-Baustein als Distraktor
const L3 = [
  {target:["A mis amigos","les","gusta","ir al cine"], extra:"gustan",
   types:{"A mis amigos":"pron","les":"pron","gusta":"","gustan":"","ir al cine":"act"}},
  {target:["A nosotros","nos","gustan","los videojuegos"], extra:"gusta",
   types:{"A nosotros":"pron","nos":"pron","gusta":"","gustan":"","los videojuegos":"act"}},
  {target:["A Lena","le","gusta","escuchar música"], extra:"les",
   types:{"A Lena":"pron","le":"pron","les":"pron","gusta":"","escuchar música":"act"}},
  {target:["A vosotras","os","gusta","viajar"], extra:"gustan",
   types:{"A vosotras":"pron","os":"pron","gusta":"","gustan":"","viajar":"act"}},
  {target:["A ti","te","gustan","los conciertos"], extra:"gusta",
   types:{"A ti":"pron","te":"pron","gusta":"","gustan":"","los conciertos":"act"}},
];

/* ---------- Logik ---------- */
let level=1, idx=0, score=0, locked=false;
let hits={1:0,2:0,3:0};
const POINTS={1:10,2:10,3:20};
const TOTAL={1:L1.length,2:L2.length,3:L3.length};
const MAX=TOTAL[1]*10+TOTAL[2]*10+TOTAL[3]*20;
let built=[];

const $=id=>document.getElementById(id);
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}

function startGame(){
  $("start").classList.add("hidden");
  $("game").classList.remove("hidden");
  render();
}

function render(){
  locked=false; built=[];
  $("feedback").className="feedback";
  $("nextBtn").classList.add("hidden");
  $("levelPill").textContent="Level "+level;
  const done = idx + (level>1?TOTAL[1]:0) + (level>2?TOTAL[2]:0);
  const all = TOTAL[1]+TOTAL[2]+TOTAL[3];
  $("bar").style.width=(done/all*100)+"%";

  const A=$("answers"), B=$("qbody");
  A.innerHTML=""; B.innerHTML=""; A.className="answers";

  if(level===1){
    const q=L1[idx];
    $("taskLabel").textContent="Welches Pronomen passt?";
    B.innerHTML=`<div class="persona">${q.p}<small>${q.d}</small></div>
      <div class="sentence" style="margin-top:14px">… <span class="gap">…</span> gusta …</div>`;
    A.className="answers row";
    shuffle(q.o).forEach(opt=>{
      const b=document.createElement("button");
      b.className="btn"; b.textContent=opt;
      b.onclick=()=>check(b, opt===q.a, q.a);
      A.appendChild(b);
    });
  }

  if(level===2){
    const q=L2[idx];
    $("taskLabel").textContent = q.t==="verb" ? "gusta oder gustan?" : "Welches Pronomen fehlt?";
    B.innerHTML=`<div class="sentence"><span class="em">${q.s[0]}</span><span class="gap">…</span><span class="em">${q.s[1]}</span></div>`;
    A.className="answers row";
    const opts = q.t==="verb" ? q.o : shuffle(q.o);
    opts.forEach(opt=>{
      const b=document.createElement("button");
      b.className="btn"; b.textContent=opt;
      b.onclick=()=>check(b, opt===q.a, q.s[0]+q.a+q.s[1]);
      A.appendChild(b);
    });
  }

  if(level===3){
    const q=L3[idx];
    $("taskLabel").textContent="Baue den Satz – Bausteine antippen";
    B.innerHTML=`<div class="buildbar empty" id="bar3"></div>`;
    const pool=document.createElement("div");
    pool.className="pool";
    shuffle([...q.target, q.extra]).forEach(word=>{
      const t=document.createElement("button");
      t.className="tile "+(q.types[word]||"");
      t.textContent=word;
      t.onclick=()=>tapTile(t, word);
      pool.appendChild(t);
    });
    A.appendChild(pool);
    const chk=document.createElement("button");
    chk.className="btn-primary"; chk.textContent="Comprobar"; chk.id="chk";
    chk.style.width="100%"; chk.disabled=true;
    chk.onclick=()=>checkBuild(q);
    A.appendChild(chk);
  }
}

function tapTile(tileBtn, word){
  if(locked) return;
  const bar=$("bar3");
  const q=L3[idx];
  const inBar=tileBtn.dataset.inbar==="1";
  if(!inBar){
    tileBtn.dataset.inbar="1";
    tileBtn.dataset.origin="pool";
    built.push(word);
    bar.classList.remove("empty");
    bar.appendChild(tileBtn);
  } else {
    tileBtn.dataset.inbar="";
    built=built.filter((w,i)=>!(w===word && i===built.indexOf(word)));
    document.querySelector("#answers .pool").appendChild(tileBtn);
    if(built.length===0) bar.classList.add("empty");
  }
  $("chk").disabled = built.length < q.target.length;
}

function checkBuild(q){
  if(locked) return;
  locked=true;
  const ok = built.length===q.target.length && built.every((w,i)=>w===q.target[i]);
  const f=$("feedback");
  if(ok){
    score+=POINTS[3]; hits[3]++;
    $("score").textContent=score;
    f.textContent="¡Muy bien! +20"; f.className="feedback show good";
  } else {
    f.innerHTML="Fast! Richtig ist:<br>«"+q.target.join(" ")+".»";
    f.className="feedback show bad";
  }
  $("nextBtn").classList.remove("hidden");
}

function check(btn, ok, sol){
  if(locked) return;
  locked=true;
  const f=$("feedback");
  document.querySelectorAll("#answers .btn").forEach(b=>{ if(b!==btn) b.classList.add("dim"); });
  if(ok){
    btn.classList.add("ok");
    score+=POINTS[level]; hits[level]++;
    $("score").textContent=score;
    f.textContent="¡Muy bien! +"+POINTS[level];
    f.className="feedback show good";
    setTimeout(nextQ, 900);
  } else {
    btn.classList.add("bad");
    // richtige Option hervorheben
    document.querySelectorAll("#answers .btn").forEach(b=>{
      if(level===1 && b.textContent===L1[idx].a){b.classList.add("ok");b.classList.remove("dim");}
      if(level===2 && b.textContent===L2[idx].a){b.classList.add("ok");b.classList.remove("dim");}
    });
    f.innerHTML="Richtig: «"+sol+"»";
    f.className="feedback show bad";
    $("nextBtn").classList.remove("hidden");
  }
}

function nextQ(){
  idx++;
  const data={1:L1,2:L2,3:L3}[level];
  if(idx>=data.length){
    if(level<3){level++; idx=0; render();}
    else finish();
  } else render();
}

function finish(){
  $("game").classList.add("hidden");
  $("end").classList.remove("hidden");
  $("endScore").textContent=score+" / "+MAX;
  const pctAll=score/MAX;
  $("endEmoji").textContent=pctAll>=.75?"🎉":pctAll>=.5?"💪":"📚";
  $("endTitle").textContent=pctAll>=.75?"¡Fenomenal!":pctAll>=.5?"¡Bien!":"¡Sigue así!";

  const names={1:"Pronomen erkennen",2:"Lücken: Pronomen & gusta/gustan",3:"Sätze bauen"};
  const R=$("results"); R.innerHTML="";
  [1,2,3].forEach(lv=>{
    const pct=Math.round(hits[lv]/TOTAL[lv]*100);
    const can=pct>=75;
    const div=document.createElement("div");
    div.className="result-bar";
    div.innerHTML=`<span class="tag ${can?'can':'train'}">${can?'Das kannst du schon':'Das übst du noch'}</span>
      <b>Level ${lv} · ${names[lv]}</b>
      <div class="track"><div class="fill" style="background:${can?'var(--verde)':'var(--rojo)'}"></div></div>`;
    R.appendChild(div);
    setTimeout(()=>{div.querySelector(".fill").style.width=pct+"%"},100);
  });
}
</script>
</body>
</html>
