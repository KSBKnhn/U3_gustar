<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>En la tienda – Unidad 3</title>
<style>
  :root{
    --bg:#F5F5F7; --card:#FFFFFF; --ink:#1D1D1F; --ink2:#6E6E73;
    --verde:#34C759; --verde-soft:#E8F9EE;
    --rojo:#FF3B30; --rojo-soft:#FFECEB;
    --azul:#0071E3; --azul-soft:#EAF3FD;
    --naranja:#FF9500; --naranja-soft:#FFF3E5; --naranja-ink:#B36A00;
    --radius:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; align-items:center;
    min-height:100dvh; padding:16px;
  }
  .app{width:100%; max-width:440px; display:flex; flex-direction:column; gap:14px; flex:1}

  header{display:flex; justify-content:space-between; align-items:center; padding:4px 2px}
  .level-pill{background:var(--card); border-radius:999px; padding:8px 16px; font-size:15px; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .score{font-size:17px; font-weight:700; font-variant-numeric:tabular-nums}
  .score span{color:var(--ink2); font-weight:500; font-size:13px}
  .progress{height:6px; background:#E5E5EA; border-radius:3px; overflow:hidden}
  .progress i{display:block; height:100%; width:0%; background:var(--naranja); border-radius:3px; transition:width .35s ease}

  .card{
    background:var(--card); border-radius:var(--radius);
    box-shadow:0 2px 12px rgba(0,0,0,.06);
    padding:24px 20px; text-align:center;
  }
  .task-label{font-size:13px; color:var(--ink2); margin-bottom:10px}
  .phrase{
    font-size:22px; font-weight:800; line-height:1.4;
    background:var(--naranja-soft); color:var(--naranja-ink);
    border-radius:16px; padding:14px 16px;
  }
  .bub{
    border-radius:16px; padding:11px 15px; font-size:17px; font-weight:700;
    line-height:1.4; text-align:left; margin-bottom:8px;
  }
  .bub .who{display:block; font-size:12px; font-weight:600; color:var(--ink2); margin-bottom:2px}
  .bub.v{background:var(--naranja-soft); color:var(--naranja-ink)}
  .bub.de{background:#E9E9EB; color:var(--ink)}
  .bub.es{background:var(--azul-soft); color:var(--azul)}

  .answers{display:flex; flex-direction:column; gap:10px}
  .btn{
    min-height:54px; border:none; border-radius:16px;
    background:var(--card); color:var(--ink);
    font-family:inherit; font-size:17.5px; font-weight:700;
    box-shadow:0 1px 4px rgba(0,0,0,.07);
    padding:12px 16px; cursor:pointer; line-height:1.35;
    transition:transform .12s ease, background .2s, color .2s;
  }
  .btn:active{transform:scale(.97)}
  .btn.ok{background:var(--verde); color:#fff}
  .btn.bad{background:var(--rojo); color:#fff}
  .btn.dim{opacity:.45}

  .btn-primary{
    min-height:54px; border:none; border-radius:999px;
    background:var(--azul); color:#fff; font-family:inherit;
    font-size:18px; font-weight:700; padding:14px 28px; cursor:pointer;
    transition:transform .12s ease;
  }
  .btn-primary:active{transform:scale(.97)}

  .feedback{
    min-height:52px; border-radius:16px; padding:12px 16px;
    font-size:16px; font-weight:600; display:none; align-items:center; justify-content:center;
    text-align:center; line-height:1.45;
  }
  .feedback.show{display:flex; animation:pop .3s ease}
  .feedback.good{background:var(--verde-soft); color:#1B7A3D}
  .feedback.bad{background:var(--rojo-soft); color:#B3261E}
  @keyframes pop{from{transform:scale(.94);opacity:0} to{transform:scale(1);opacity:1}}
  @media (prefers-reduced-motion:reduce){ .feedback.show{animation:none} }

  .screen{flex:1; display:flex; flex-direction:column; justify-content:center; gap:16px; text-align:center; animation:pop .35s ease}
  .screen h1{font-size:30px; font-weight:800; letter-spacing:-.5px}
  .screen h1 em{font-style:normal; color:var(--naranja)}
  .screen p{font-size:17px; color:var(--ink2); line-height:1.5}
  .lv-list{display:flex; flex-direction:column; gap:10px; text-align:left}
  .lv-item{background:var(--card); border-radius:16px; padding:14px 16px; display:flex; gap:12px; align-items:center; box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .lv-item .n{width:34px; height:34px; border-radius:10px; background:var(--naranja-soft); color:var(--naranja-ink); font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0}
  .lv-item div b{display:block; font-size:16px}
  .lv-item div span{font-size:13.5px; color:var(--ink2)}

  .result-bar{background:var(--card); border-radius:16px; padding:14px 16px; text-align:left; box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .result-bar b{font-size:15.5px}
  .result-bar .track{height:8px; background:#E5E5EA; border-radius:4px; margin-top:8px; overflow:hidden}
  .result-bar .fill{height:100%; border-radius:4px; width:0; transition:width .8s ease}
  .tag{font-size:13px; font-weight:700; padding:3px 10px; border-radius:999px; float:right}
  .tag.can{background:var(--verde-soft); color:#1B7A3D}
  .tag.train{background:var(--rojo-soft); color:#B3261E}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="app">

  <!-- START -->
  <section class="screen" id="start">
    <div style="font-size:56px">🛍️</div>
    <h1>En la <em>tienda</em></h1>
    <p>Einkaufen &amp; Sprachmittlung · Unidad 3<br>3 Levels · ca. 10–12 Minuten</p>
    <div class="lv-list">
      <div class="lv-item"><span class="n">1</span><div><b>Verstehen</b><span>Was bedeuten die Redemittel?</span></div></div>
      <div class="lv-item"><span class="n">2</span><div><b>Anwenden</b><span>die passende Antwort im Dialog wählen</span></div></div>
      <div class="lv-item"><span class="n">3</span><div><b>Mitteln</b><span>Deutsch ↔ Spanisch – die beste Übertragung</span></div></div>
    </div>
    <button class="btn-primary" onclick="startGame()">Empezar</button>
  </section>

  <!-- SPIEL -->
  <section id="game" class="hidden" style="display:flex;flex-direction:column;gap:14px;flex:1">
    <header>
      <span class="level-pill" id="levelPill">Level 1</span>
      <span class="score"><span>Puntos&nbsp;</span><b id="score">0</b></span>
    </header>
    <div class="progress"><i id="bar"></i></div>

    <div class="card" id="qcard">
      <div class="task-label" id="taskLabel"></div>
      <div id="qbody"></div>
    </div>

    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>
    <div style="text-align:center"><button class="btn-primary hidden" id="nextBtn" onclick="nextQ()">Weiter</button></div>
  </section>

  <!-- ENDE -->
  <section class="screen hidden" id="end">
    <div style="font-size:60px" id="endEmoji">🎉</div>
    <h1 id="endTitle">¡Muy bien!</h1>
    <p><b id="endScore" style="color:var(--ink);font-size:22px"></b> Punkte</p>
    <div id="results" style="display:flex;flex-direction:column;gap:10px"></div>
    <button class="btn-primary" onclick="location.reload()">Otra vez</button>
  </section>
</div>

<script>
/* ---------- Inhalte: Einkaufsdialog & Sprachmittlung (Unidad 3) ---------- */

// Level 1: Redemittel verstehen (ES -> DE), 10 P.
const L1 = [
  {es:"¿Qué talla tienes?", a:"Welche Größe hast du?", o:["Welche Größe hast du?","Welche Farbe magst du?","Was kostet das?"]},
  {es:"¿Cuánto cuesta?", a:"Wie viel kostet das?", o:["Wie viel kostet das?","Wie spät ist es?","Wie viele möchtest du?"]},
  {es:"¿Te puedo ayudar?", a:"Kann ich dir helfen?", o:["Kann ich dir helfen?","Kannst du mir helfen?","Gefällt es dir?"]},
  {es:"Está de oferta.", a:"Es ist im Angebot.", o:["Es ist im Angebot.","Es ist ausverkauft.","Es ist zu teuer."]},
  {es:"¡Me lo llevo!", a:"Ich nehme es!", o:["Ich nehme es!","Ich bringe es zurück.","Ich ziehe es an."]},
  {es:"¿Qué te parece?", a:"Wie findest du es?", o:["Wie findest du es?","Was suchst du?","Wo ist es?"]},
  {es:"Va bien con el pantalón.", a:"Es passt gut zur Hose.", o:["Es passt gut zur Hose.","Es ist so groß wie die Hose.","Es kostet so viel wie die Hose."]},
  {es:"Prefiero ese de ahí.", a:"Ich mag lieber das da (hinten).", o:["Ich mag lieber das da (hinten).","Ich nehme das hier.","Ich brauche das nicht."]},
];

// Level 2: passende Reaktion im Dialog wählen, 10 P.
const L2 = [
  {who:"v", say:"¿Te puedo ayudar?", a:"Sí, necesito una chaqueta.", o:["Sí, necesito una chaqueta.","¡A mí también!","Estoy leyendo un libro."]},
  {who:"v", say:"¿Qué talla tienes?", a:"La talla M.", o:["La talla M.","Cuesta 20 euros.","Me gusta el azul."]},
  {who:"v", say:"¿Qué color prefieres?", a:"Prefiero el negro.", o:["Prefiero el negro.","La talla L.","¡A mí tampoco!"]},
  {who:"k", say:"¿Cuánto cuesta la chaqueta?", a:"Cuesta 40 euros.", o:["Cuesta 40 euros.","Cuestan 40 euros.","Es la talla S."]},
  {who:"k", say:"¿Cuánto cuestan los zapatos?", a:"Cuestan 60 euros.", o:["Cuestan 60 euros.","Cuesta 60 euros.","Son muy simpáticos."]},
  {who:"v", say:"¿Qué te parece esta camisa?", a:"Me parece muy elegante.", o:["Me parece muy elegante.","Me gustan los libros.","Estoy cansado."]},
  {who:"k", say:"La camisa es un poco grande…", a:"¿Quieres la talla S?", o:["¿Quieres la talla S?","Cuesta 10 euros.","¡Qué guay!"]},
  {who:"v", say:"¿Algo más?", a:"No, gracias. ¡Me lo llevo!", o:["No, gracias. ¡Me lo llevo!","Sí, soy de Alemania.","A mí sí."]},
];

// Level 3: Sprachmittlung – beste Übertragung wählen, 20 P.
// dir: "de2es" (Mia -> Verkäuferin) oder "es2de" (Verkäuferin -> Mia)
const L3 = [
  {dir:"de2es", who:"Mia 🇩🇪", say:"Frag mal, ob sie die Jacke in M haben!",
   a:"¿Tiene la chaqueta en la talla M?",
   o:["¿Tiene la chaqueta en la talla M?","¿Cuánto cuesta la chaqueta?","Me gusta mucho la chaqueta."]},
  {dir:"de2es", who:"Mia 🇩🇪", say:"Was kostet das T-Shirt?",
   a:"¿Cuánto cuesta la camiseta?",
   o:["¿Cuánto cuesta la camiseta?","¿Qué talla tiene la camiseta?","¿Te gusta la camiseta?"]},
  {dir:"es2de", who:"La vendedora 🇪🇸", say:"Está de oferta: solo 15 euros.",
   a:"Es ist im Angebot – nur 15 Euro.",
   o:["Es ist im Angebot – nur 15 Euro.","Es ist ausverkauft, tut mir leid.","Es kostet 50 Euro."]},
  {dir:"de2es", who:"Mia 🇩🇪", say:"Die Hose gefällt mir sehr!",
   a:"A mi amiga le gusta mucho el pantalón.",
   o:["A mi amiga le gusta mucho el pantalón.","A mi amiga no le gusta el pantalón.","Mi amiga está comprando un pantalón."]},
  {dir:"es2de", who:"La vendedora 🇪🇸", say:"¿Qué talla tiene tu amiga?",
   a:"Sie fragt, welche Größe du hast.",
   o:["Sie fragt, welche Größe du hast.","Sie fragt, welche Farbe du magst.","Sie fragt, wie du heißt."]},
];

/* ---------- Logik ---------- */
let level=1, idx=0, score=0, locked=false;
let hits={1:0,2:0,3:0};
const POINTS={1:10,2:10,3:20};
const TOTAL={1:L1.length,2:L2.length,3:L3.length};
const MAX=TOTAL[1]*10+TOTAL[2]*10+TOTAL[3]*20;

const $=id=>document.getElementById(id);
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}

function startGame(){
  $("start").classList.add("hidden");
  $("game").classList.remove("hidden");
  render();
}

function render(){
  locked=false;
  $("feedback").className="feedback";
  $("nextBtn").classList.add("hidden");
  $("levelPill").textContent="Level "+level;
  const done = idx + (level>1?TOTAL[1]:0) + (level>2?TOTAL[2]:0);
  const all = TOTAL[1]+TOTAL[2]+TOTAL[3];
  $("bar").style.width=(done/all*100)+"%";

  const A=$("answers"), B=$("qbody");
  A.innerHTML=""; B.innerHTML="";

  if(level===1){
    const q=L1[idx];
    $("taskLabel").textContent="Was bedeutet das?";
    B.innerHTML=`<div class="phrase">«${q.es}»</div>`;
    shuffle(q.o).forEach(opt=>{
      const b=document.createElement("button");
      b.className="btn"; b.textContent=opt;
      b.onclick=()=>check(b, opt===q.a, q.a);
      A.appendChild(b);
    });
  }

  if(level===2){
    const q=L2[idx];
    $("taskLabel").textContent="Wie geht der Dialog weiter?";
    const whoLabel = q.who==="v" ? "La vendedora 🛍️" : "Tú 🙋";
    B.innerHTML=`<div class="bub v"><span class="who">${whoLabel}</span>${q.say}</div>`;
    shuffle(q.o).forEach(opt=>{
      const b=document.createElement("button");
      b.className="btn"; b.textContent=opt;
      b.onclick=()=>check(b, opt===q.a, q.a);
      A.appendChild(b);
    });
  }

  if(level===3){
    const q=L3[idx];
    $("taskLabel").textContent = q.dir==="de2es"
      ? "Mia spricht kein Spanisch. Was sagst du der Verkäuferin?"
      : "Was sagst du Mia auf Deutsch?";
    const cls = q.dir==="de2es" ? "de" : "es";
    B.innerHTML=`<div class="bub ${cls}"><span class="who">${q.who}</span>${q.say}</div>`;
    shuffle(q.o).forEach(opt=>{
      const b=document.createElement("button");
      b.className="btn"; b.textContent=opt;
      b.onclick=()=>check(b, opt===q.a, q.a);
      A.appendChild(b);
    });
  }
}

function check(btn, ok, sol){
  if(locked) return;
  locked=true;
  const f=$("feedback");
  document.querySelectorAll("#answers .btn").forEach(b=>{ if(b!==btn) b.classList.add("dim"); });
  if(ok){
    btn.classList.add("ok");
    score+=POINTS[level]; hits[level]++;
    $("score").textContent=score;
    f.textContent="¡Muy bien! +"+POINTS[level];
    f.className="feedback show good";
    setTimeout(nextQ, 900);
  } else {
    btn.classList.add("bad");
    document.querySelectorAll("#answers .btn").forEach(b=>{
      if(b.textContent===sol){b.classList.add("ok");b.classList.remove("dim");}
    });
    f.innerHTML="Richtig: «"+sol+"»";
    f.className="feedback show bad";
    $("nextBtn").classList.remove("hidden");
  }
}

function nextQ(){
  idx++;
  const data={1:L1,2:L2,3:L3}[level];
  if(idx>=data.length){
    if(level<3){level++; idx=0; render();}
    else finish();
  } else render();
}

function finish(){
  $("game").classList.add("hidden");
  $("end").classList.remove("hidden");
  $("endScore").textContent=score+" / "+MAX;
  const pctAll=score/MAX;
  $("endEmoji").textContent=pctAll>=.75?"🎉":pctAll>=.5?"💪":"📚";
  $("endTitle").textContent=pctAll>=.75?"¡Fenomenal!":pctAll>=.5?"¡Bien!":"¡Sigue así!";

  const names={1:"Redemittel verstehen",2:"Im Dialog reagieren",3:"Sprachmittlung"};
  const R=$("results"); R.innerHTML="";
  [1,2,3].forEach(lv=>{
    const pct=Math.round(hits[lv]/TOTAL[lv]*100);
    const can=pct>=75;
    const div=document.createElement("div");
    div.className="result-bar";
    div.innerHTML=`<span class="tag ${can?'can':'train'}">${can?'Das kannst du schon':'Das übst du noch'}</span>
      <b>Level ${lv} · ${names[lv]}</b>
      <div class="track"><div class="fill" style="background:${can?'var(--verde)':'var(--rojo)'}"></div></div>`;
    R.appendChild(div);
    setTimeout(()=>{div.querySelector(".fill").style.width=pct+"%"},100);
  });
}
</script>
</body>
</html>
